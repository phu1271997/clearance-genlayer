<!-- Small-size twin of /logo.svg (the Explorer listing mark), redrawn for 16-32px:
     fewer bars, thicker bodies, no glow. Same ring + waveform silhouette so the
     browser tab, the app and the catalog card all read as one product. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="d">
      <circle cx="16" cy="16" r="10.5"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0d0e15"/>
  <g clip-path="url(#d)" fill="url(#g)">
    <rect x="9.6"  y="14.1" width="2.4" height="3.8"  rx="1.2"/>
    <rect x="14.8" y="9.8"  width="2.4" height="12.4" rx="1.2"/>
    <rect x="20"   y="13.2" width="2.4" height="5.6"  rx="1.2"/>
  </g>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="url(#g)" stroke-width="2.2"/>
</svg>
