<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clearance mark: one seal, not two icons side by side.
       The waveform is clipped to the disc silhouette so the ring and the
       bars read as a single struck seal — a cleared record. Palette is
       lifted from the running app (purple #8B5CF6 -> cyan #22D3EE on the
       #0B0C13 surface) so the listing card and the dApp look related. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181830"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="discClip">
      <circle cx="256" cy="256" r="148"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Waveform, clipped to the disc.
       Filled rounded rects rather than stroked <line>s: several SVG
       rasterizers (macOS qlmanage among them) drop stroked lines inside a
       clip-path group, which silently ships a logo that is just a ring. -->
  <g clip-path="url(#discClip)" fill="url(#mark)">
    <rect x="171" y="226" width="26" height="60"  rx="13"/>
    <rect x="207" y="186" width="26" height="140" rx="13"/>
    <rect x="243" y="152" width="26" height="208" rx="13"/>
    <rect x="279" y="196" width="26" height="120" rx="13"/>
    <rect x="315" y="216" width="26" height="80"  rx="13"/>
  </g>

  <!-- Seal ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#mark)" stroke-width="28"/>
</svg>
